<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login - OLMS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to bottom, #F98EF6, #B51F1A);" class="d-flex justify-content-center align-items-center vh-100">

    <!-- Main Login Form -->
    <div class="card shadow text-white" style="max-width: 700px; width: 100%; background-color: #000;">
        <div class="row g-0 align-items-center">

            <!-- Left side: Login form -->
            <div class="col-md-7 p-5">
                <h2 class="fw-bold mb-3 text-center">User Login</h2>
                <hr class="border-light">

                <form>
                    <div class="mb-3">
                        <label for="usernameOrEmail" class="form-label fw-semibold">Email/Username</label>
                        <input type="text" class="form-control bg-success-subtle rounded-pill border-0" id="usernameOrEmail" placeholder="Email/Username">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control bg-success-subtle rounded-start-pill border-0" id="password" placeholder="Password">
                            <span class="input-group-text bg-success-subtle border-0 rounded-end-pill">
                                <img src="../images/closedEye.png" alt="Show Password Icon" width="20">
                            </span>
                        </div>
                    </div>


                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-light rounded-pill fw-semibold">Login</button>
                    </div>

                    <p class="text-center mb-0">
                        Oh, don’t have an account?
                        <a href="UserRegistration.html"
                            class="text-warning text-decoration-none"
                            style="transition: color 0.3s;"
                            onmouseover="this.style.setProperty('color', '#FA0060', 'important')"
                            onmouseout="this.style.setProperty('color', '#ffc107', 'important')">
                            Register now
                        </a>
                    </p>
                </form>
            </div>

            <div class="col-md-5 text-center ps-2 pe-0">
                <img src="../images/login.png" alt="User Reading Icon" class="img-fluid ms-n4" width="450">
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
