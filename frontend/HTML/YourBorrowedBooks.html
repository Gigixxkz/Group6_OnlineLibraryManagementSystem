<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Borrowed Books - OLMS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    /* Smooth hover pop effect */
    .book-card {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        border-radius: 12px;
        min-height: 250px;

    }
    
    .book-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
</style>
</head>

<body>
    <!-- Shared Navbar -->
    <div id="navbar-container"></div>

    <h1 class="text-center">Your Borrowed Books</h1>

    <section class="container my-5">
    <h2 class="mb-4 text-center">Your Borrowed Books</h2>

    <div class="row g-4" id="borrowedBooksContainer">

        <!-- Example Book Card -->
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card shadow-sm border-0 book-card h-100">

                <div class="row g-0">
                    <!-- Cover -->
                    <div class="col-4">
                        <img src="" class="img-fluid rounded-start"
                             style="height: 100%; width: 100%; object-fit: cover;">
                    </div>

                    <!-- Info -->
                    <div class="col-8">
                        <div class="card-body p-2">
                            <h6 class="card-title mb-1">Book Title</h6>
                            <p class="text-muted small mb-2">Author: John Doe</p>

                            <div class="small">
                                <div><strong>Borrowed:</strong> 2025-01-10</div>
                                <div><strong>Return:</strong> 2025-01-20</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        

    </div>
    </section>



    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">© 2025 Online Library Management System | Group 6 - Software Engineering II</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared Navbar JS -->
    <script src="/static/Scripts/navbar.js"></script>

</body>
</html>
