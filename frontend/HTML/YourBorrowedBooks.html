<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Your Borrowed Books</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

 
</head>
<body class="bg-dark text-light">

  <!-- Shared Navbar -->
  <div id="navbar-container"></div>

  <!-- Global Modals Container -->
  <div id="global-modals"></div>

  <div class="container py-5">
    <div class="card rounded-4 shadow" style="background:#a00055;">
      <div class="card-body">
        <h3 class="card-title text-center text-white mb-3">Your Borrowed Books</h3>

        <!-- Filters -->
        <div class="d-flex gap-2 align-items-center mb-3 flex-wrap">
          <input id="searchInput" class="form-control me-2" style="max-width:320px" placeholder="Search title or author...">
          <select id="statusFilter" class="form-select" style="max-width:160px">
            <option value="all">All statuses</option>
            <option value="Borrowed">Borrowed</option>
            <option value="Overdue">Overdue</option>
            <option value="Returned">Returned</option>
          </select>

          <label class="mb-0 ms-2 text-white">From</label>
          <input id="startDate" type="date" class="form-control" style="max-width:150px">
          <label class="mb-0 text-white">To</label>
          <input id="endDate" type="date" class="form-control" style="max-width:150px">

          <button id="applyBtn" class="btn btn-light">Apply</button>
          <button id="resetBtn" class="btn btn-outline-light">Reset</button>
        </div>

        <!-- Legend -->
        <div class="mb-3">
          <span class="badge bg-primary">Borrowed</span>
          <span class="badge bg-danger">Overdue</span>
          <span class="badge bg-success">Returned</span>
        </div>

        <!-- Cards container -->
        <div id="borrowedBooksContainer" class="row gy-3">
          <!-- Cards inserted dynamically by yourborrowedbooks.js -->
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/static/Scripts/yourborrowedbooks.js"></script>
    
  <script src="/static/Scripts/navbar.js"></script>

</body>
</html>
