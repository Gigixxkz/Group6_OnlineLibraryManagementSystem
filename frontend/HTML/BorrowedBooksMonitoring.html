<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borrowed Books Monitoring</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

        <div id="navbar-container"></div>


  <style>
    body { background-color: #5a0033; color: #fff; font-family: "Poppins", sans-serif; }
    .monitor-card { background-color: #111; border-radius: 12px; padding: 30px; margin-top: 40px; }
    .search-box { width: 60%; background-color: #333; border: none; color: #fff; }
    .search-btn { background-color: #5f7367; color: #fff; border: none; }
    .btn-return { background-color: #28a745; color: #fff; border: none; }
    .btn-reminder { background-color: #c0392b; color: #fff; border: none; }
    .overdue { color: #ff4d4d; font-weight: bold; }
  </style>
</head>

<body>

<div class="container monitor-card">
  <h3 class="text-center">Borrowed Books Monitoring</h3>

  <div class="d-flex justify-content-center mb-3">
    <input id="searchInput" class="form-control search-box" placeholder="Search...">
    <button class="search-btn px-4" id="searchBtn">Search</button>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-striped align-middle">
      <thead>
        <tr>
          <th>User</th>
          <th>Book Title</th>
          <th>ISBN</th>
          <th>Borrow Date</th>
          <th>Due Date</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="borrowedBooksTableBody"></tbody>
    </table>
  </div>
</div>

<!-- Return Modal -->
<div class="modal fade" id="returnModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header">
        <h5>Confirm Return</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-return" id="confirmReturnBtn">Confirm</button>
        <button class="btn btn-reminder" data-bs-dismiss="modal">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/Scripts/BorrowedBooksMonitoring.js"></script>
<script src="/static/Scripts/navbar.js"></script>

</body>
</html>
