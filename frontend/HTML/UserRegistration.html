<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Registration - OLMS</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to bottom,#be6f98, #4c1431);"
      class="d-flex flex-column min-vh-100">
	<div class="flex-grow-1 d-flex flex-column justify-content-center">
	<!-- Message -->
	<div class="text-center mb-4">
		<h1 class="fw-bold" style="font-size: 3rem; color: #000000;">
			Create Your Account
		</h1>

		<p class="lead" style="color:#2b2b2b; font-size:1.2rem; font-weight:600;">
			Join the Archive of Light and begin your journey.
		</p>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	
	<!-- Center the card -->
<div class="d-flex justify-content-center">
    <div class="position-relative">

        <!-- Main Registration Form -->
        <div class="card shadow text-white" style="max-width: 900px; width: 100%; background-color: #000;">

			<div class="row g-0 align-items-center">

				<!-- Left side: Registration form -->
				<div class="col-md-7 p-4">
					<h2 class="fw-bold mb-3 text-center">User Registration</h2>
					<hr class="border-light mb-3">

					<form id="registerForm">
						<!-- Name and Surname -->
						<div class="row mb-2">
							<div class="col">
								<label for="name" class="form-label fw-semibold">Name</label>
								<input name="name" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="name" placeholder="Name" required minlength="2">
							</div>
							<div class="col">
								<label for="surname" class="form-label fw-semibold">Surname</label>
								<input name="surname" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="surname" placeholder="Surname" required minlength="2">
							</div>
						</div>

						<!-- Username -->
						<div class="mb-2">
							<label for="username" class="form-label fw-semibold">Username</label>
							<input name="username" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="username" placeholder="Username" required minlength="2">
						</div>

						<!-- Email -->
						<div class="mb-2">
							<label for="email" class="form-label fw-semibold">Email Address</label>
							<input name="email" type="email" class="form-control bg-success-subtle rounded-pill border-0" id="email" placeholder="Email Address" required minlength="3">
						</div>

						<div class="mb-2">
							<label for="password" class="form-label fw-semibold">Password</label>
							<input name="password" type="password"
							class="form-control bg-success-subtle rounded-pill border-0"
							id="password" placeholder="Password" required minlength="4">
						</div>

						<!-- Phone Number -->
						<div class="mb-3">
							<label for="phone" class="form-label fw-semibold">Phone Number</label>
							<input input name="phone_number" type="tel" class="form-control bg-success-subtle rounded-pill border-0" id="phone" placeholder="Phone Number" required minlength="8">
						</div>

						<!-- Redirect to Login -->
						<p class="text-center mb-0">
							Already have an account?

							<!-- UPDATED PATH -->
							<a href="/static/HTML/UserLogin.html"
							   class="text-warning text-decoration-none"
							   style="transition: color 0.3s;"
							   onmouseover="this.style.setProperty('color', '#a00055', 'important')"
                               onmouseout="this.style.setProperty('color', '#be6f98', 'important')">
							   Login now
							</a>
						</p>

						<!-- Register Button -->
						<div class="d-grid mb-2">
							<button type="submit"
								class="btn rounded-pill fw-semibold"
								style="background-color:#a00055; color:white; border:none;"
								onmouseover="this.style.backgroundColor='#7e0041'"
								onmouseout="this.style.backgroundColor='#a00055'">
								Register
							</button>
						</div>
					</form>
				</div>

				<!-- Right side: Image -->
				<div class="col-md-5 text-center pe-4">

					<!-- UPDATED PATH -->
					<img src="/static/images/stack.png" alt="Registration Illustration" class="img-fluid" style="max-height: 240px;">
				</div>
			</div>
		</div>

        <!-- Decorative image  -->
        <!-- I added rotation to make the decorative image look more aesthetic -->
        
        <!-- UPDATED PATH -->
        <img src="/static/images/flower.png" alt="Decorative flowers"
        style="position: absolute; bottom: -60px; right: -120px; width: 300px; transform: rotate(30deg);">

		<div id="responseMsg" class="mt-3 text-center"></div> <!-- Making the popup more noticeable using bootstrap -->
    </div> 
</div> 
</div>
<!-- Footer -->
    <footer class="bg-dark text-light text-center py-3 mt-5 w-100">
        <p class="mb-0">© 2025 Online Library Management System | Group 6 - Software Engineering II</p>
    </footer>


</body>

<script src="/static/scripts/registration.js"></script>

</html>
