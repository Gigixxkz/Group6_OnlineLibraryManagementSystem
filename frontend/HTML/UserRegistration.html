<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>User Registration - OLMS</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background: linear-gradient(to bottom, #F98EF6, #B51F1A);" class="d-flex justify-content-center align-items-center vh-100">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<div class="position-relative">

		<!-- Main Registration Form -->
		<div class="card shadow text-white" style="max-width: 900px; width: 100%; background-color: #000;">
			<div class="row g-0 align-items-center">

				<!-- Left side: Registration form -->
				<div class="col-md-7 p-4">
					<h2 class="fw-bold mb-3 text-center">User Registration</h2>
					<hr class="border-light mb-3">

					<form id="registerForm">
						<!-- Name and Surname -->
						<div class="row mb-2">
							<div class="col">
								<label for="name" class="form-label fw-semibold">Name</label>
								<input name="name" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="name" placeholder="Name" required minlength="2">
							</div>
							<div class="col">
								<label for="surname" class="form-label fw-semibold">Surname</label>
								<input name="surname" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="surname" placeholder="Surname" required minlength="2">
							</div>
						</div>

						<!-- Username -->
						<div class="mb-2">
							<label for="username" class="form-label fw-semibold">Username</label>
							<input name="username" type="text" class="form-control bg-success-subtle rounded-pill border-0" id="username" placeholder="Username" required minlength="2">
						</div>

						<!-- Email -->
						<div class="mb-2">
							<label for="email" class="form-label fw-semibold">Email Address</label>
							<input name="email" type="email" class="form-control bg-success-subtle rounded-pill border-0" id="email" placeholder="Email Address" required minlength="3">
						</div>

						<!-- Password -->
						<div class="mb-2">
							<label for="password" class="form-label fw-semibold">Password</label>
							<div class="input-group">
								<input name="password" type="password" class="form-control bg-success-subtle rounded-start-pill border-0" id="password" placeholder="Password" required minlength="4">
								<span class="input-group-text bg-success-subtle border-0 rounded-end-pill">
									<img src="../images/closedEye.png" alt="Show Password Icon" width="20">
								</span>
							</div>
						</div>

						<!-- Phone Number -->
						<div class="mb-3">
							<label for="phone" class="form-label fw-semibold">Phone Number</label>
							<input input name="phone_number" type="tel" class="form-control bg-success-subtle rounded-pill border-0" id="phone" placeholder="Phone Number" required minlength="8">
						</div>

						<!-- Register Button -->
						<div class="d-grid mb-2">
							<button type="submit" class="btn btn-light rounded-pill fw-semibold">Register</button>
						</div>

						<!-- Redirect to Login -->
						<p class="text-center mb-0">
							Already have an account?
							<a href="UserLogin.html"
							   class="text-warning text-decoration-none"
							   style="transition: color 0.3s;"
							   onmouseover="this.style.setProperty('color', '#FA0060', 'important')"
							   onmouseout="this.style.setProperty('color', '#ffc107', 'important')">
							   Login now
							</a>
						</p>
					</form>
				</div>

				<!-- Right side: Image -->
				<div class="col-md-5 text-center pe-4">
					<img src="../images/registration.png" alt="Registration Illustration" class="img-fluid" style="max-height: 240px;">
				</div>
			</div>
		</div>

        <!-- Decorative image  -->
        <!-- I added rotation to make the decorative image look more aestheticc -->
        <img src="../images/decor.png" alt="Decorative flowers"
        style="position: absolute; bottom: -60px; right: -120px; width: 300px; transform: rotate(30deg);">
		<div id="responseMsg"></div>

	</div>


	<script src="../Scripts/registration.js"></script>
</body>
</html>
